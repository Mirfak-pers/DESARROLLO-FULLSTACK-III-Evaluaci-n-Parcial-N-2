spring.application.name=msPedidos-test

# Base de datos H2 en memoria para pruebas
spring.datasource.url=jdbc:h2:mem:pedidos_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate para pruebas
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# URL falsa/local del microservicio Inventario para pruebas
servicios.inventario.url=http://localhost:8081/api/inventario/productos

# Evita cargar .env en pruebas
spring.config.import=

# Desactiva Eureka en pruebas
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false

# Evita conexión real a Keycloak durante pruebas
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/smartlogix/protocol/openid-connect/certs

# Desactiva logs en archivo durante pruebas
logging.file.name=
logging.level.root=WARN
logging.level.com.smartlogix=INFO